          <div class="prose e-content" id="noteContents"><!--[--><p>Sometimes a web service doesn’t implement compression, but if you use <a href="Caddy">Caddy</a> as a reverse proxy, you can enable compression on the fly:</p><pre><code>mydomain.tld {
  encode gzip zstd
  reverse_proxy backend:8080
}
